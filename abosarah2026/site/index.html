<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>حل سلمى</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Tajawal:wght@400;700&display=swap">
<style>
/* layout: one column app; home = bank tiles, then systems/groups; quiz = one question per screen */
:root{--bg:#f6f6f4;--card:#fff;--fg:#1b1d1f;--mut:#6b7078;--line:#dcdcd6;--acc:#1f4e8c;--accfg:#fff;--ok:#1b7f3b;--okbg:#e2f3e6;--bad:#b3261e;--badbg:#fbe4e2;--note:#fff7da;--hdr:#eceae4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2226;--fg:#ececea;--mut:#9aa0a8;--line:#33373d;--acc:#7fb0ee;--accfg:#10151b;--ok:#6fd08a;--okbg:#173a24;--bad:#ff8a80;--badbg:#44201d;--note:#3a3416;--hdr:#262a2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2226;--fg:#ececea;--mut:#9aa0a8;--line:#33373d;--acc:#7fb0ee;--accfg:#10151b;--ok:#6fd08a;--okbg:#173a24;--bad:#ff8a80;--badbg:#44201d;--note:#3a3416;--hdr:#262a2f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.5 Inter,Tajawal,system-ui,sans-serif;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:760px;margin:0 auto;padding-block:12px 80px}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font:700 17px/1.2 Tajawal,Inter,sans-serif;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;min-height:40px}
.btn.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.tile{text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.tile b{font-size:17px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}
.sm{font-size:13px;color:var(--mut)}
.sys{margin:12px 0 4px;font:700 15px Tajawal,Inter,sans-serif;display:flex;justify-content:space-between;gap:8px;background:var(--hdr);padding:8px 10px;border-radius:8px}
.grp{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}
.grp .t{flex:1;min-width:0}.grp .n{font-size:13px;color:var(--mut);white-space:nowrap}
.how{background:var(--hdr);border-inline-start:4px solid var(--acc);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.stem{font-size:17px;line-height:1.55;margin:0 0 12px;white-space:pre-wrap}
.opt{direction:ltr;display:flex;gap:10px;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;margin:8px 0;min-height:48px;align-items:flex-start}
.opt b{min-width:1.4em}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.reveal{margin-top:12px;font-size:15px}
.reveal div{margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--hdr)}
.reveal .n{background:var(--note)}
.res{font-weight:700;font-size:16px}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.nav{display:flex;gap:8px;position:sticky;bottom:0;padding:10px 0 max(10px,env(safe-area-inset-bottom,0px));background:var(--bg)}
.nav .btn{flex:1}
.tag{font-size:12px;color:var(--mut)}
textarea{width:100%;min-height:90px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
[dir=rtl] .ltr{direction:ltr;text-align:left}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
body{font-size:14px;line-height:1.4}
#app{padding-block:4px 56px}
.top{padding:4px 0}.top h1{font-size:15px}
.btn{padding:5px 10px;min-height:34px;border-radius:8px;font-size:14px}
.card{padding:10px;margin:6px 0}
.stem{font-size:15px;line-height:1.4;margin:0 0 6px}
.opt{padding:6px 10px;margin:5px 0;min-height:36px;font-size:14px;gap:8px}
.reveal{margin-top:6px;font-size:13.5px}.reveal div{margin:4px 0;padding:5px 8px}
.res{font-size:14px}
.nav{padding:6px 0 max(6px,env(safe-area-inset-bottom,0px))}
.how{padding:6px 10px;margin:6px 0;font-size:13px}
.tiles{gap:8px;margin:8px 0}.tile{padding:8px}
.grp{padding:7px 10px;margin:4px 0}.sys{margin:8px 0 2px;padding:6px 8px}
#qtn{font-size:18px!important}#qts{font-size:12px!important}
html,body{overflow-x:hidden;max-width:100vw}
*{box-sizing:border-box}
#app{width:100%;max-width:760px}
.card,.stem,.opt,.reveal,.reveal div,.how,.grp,.tile{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word}
.opt>*{min-width:0}
img,svg,video,pre,table{max-width:100%}
table{display:block;overflow-x:auto}
pre{white-space:pre-wrap}
</style>
<style>
/* big-text mode: the question fills the page */
body{font-size:20px}
.stem{font-size:clamp(24px,3.4vw,34px)!important;line-height:1.55!important;margin:0 0 16px!important}
.opt{font-size:clamp(21px,2.9vw,29px)!important;min-height:76px!important;padding:16px 18px!important;margin:12px 0!important;gap:14px!important;align-items:center!important}
.opt b{font-size:1.05em;min-width:1.6em}
.card{padding:20px!important;margin:10px 0!important}
.reveal{font-size:clamp(18px,2.3vw,24px)!important}.reveal div{padding:12px 14px!important;margin:10px 0!important}
.res{font-size:clamp(20px,2.6vw,28px)!important}
.btn{font-size:clamp(17px,2.1vw,22px)!important;min-height:52px!important;padding:10px 16px!important}
.nav .btn{min-height:64px!important;font-size:clamp(20px,2.6vw,26px)!important}
.top h1{font-size:clamp(17px,2.2vw,24px)!important}
.how{font-size:clamp(15px,1.9vw,19px)!important}
.tag{font-size:15px}
.grp{font-size:clamp(17px,2.2vw,22px);padding:14px 16px!important}.sys{font-size:clamp(17px,2.2vw,22px)}
.tile b{font-size:22px}
</style>
<style>
/* question view fills the whole screen height */
html,body{height:100%}
#app.full{display:flex;flex-direction:column;height:100%;max-width:none;padding-block:0 0}
#app.full>.top,#app.full>.how,#app.full>.row,#app.full>.nav{flex:none}
#app.full>.card{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;margin:8px 0}
#app.full>.card .stem{flex:none}
#app.full>.card .opt{flex:1 1 auto;max-height:200px}
#app.full>.card .reveal{flex:none}
#app.full #qtimer{align-self:flex-start}
#app.full>.nav{position:static;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
</style>
<style>.qimg{display:block;max-width:100%;max-height:60vh;margin:10px auto;border:1px solid var(--line);border-radius:10px;background:#fff;object-fit:contain}</style>
<style>.kwh{background:#ffe066;color:#111;border-radius:3px;padding:0 2px}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kwh{background:#8a6d00;color:#fff}}:root[data-theme="dark"] .kwh{background:#8a6d00;color:#fff}</style>


<div id="app" dir="rtl"></div>
<button id="qtimer" hidden aria-label="مؤقت السؤال" style="display:flex;flex-direction:row;align-items:center;gap:6px;margin:0 0 8px;padding:4px 14px;height:34px;border-radius:17px;border:2px solid var(--ok);background:var(--card);color:var(--fg);line-height:1;font-family:Inter,Tajawal,sans-serif"><b id="qtn" style="font-size:22px">15</b><span id="qts" style="font-size:10px;color:var(--mut)">ثانية</span></button>
<script>
(function(){
var PER=15000,left=PER,paused=false,fired=false,last=Date.now(),stem='',ac=null;
var b=document.getElementById('qtimer'),n=document.getElementById('qtn'),s=document.getElementById('qts');
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&ac&&ac.state!=='running'){try{ac.resume();}catch(e){}}});
document.addEventListener('pointerdown',unlock,true);
function beep(){try{if(ac&&ac.state!=='running')ac.resume();}catch(e){}try{if(ac){var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type='sine';o.frequency.setValueAtTime(330,t);o.frequency.linearRampToValueAtTime(520,t+0.6);o.frequency.linearRampToValueAtTime(260,t+1.8);l.frequency.value=6;lg.gain.value=18;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.25);g.gain.setValueAtTime(0.3,t+1.2);g.gain.exponentialRampToValueAtTime(0.0001,t+1.9);o.connect(g);g.connect(ac.destination);o.start(t);l.start(t);o.stop(t+2);l.stop(t+2);}}catch(e){}try{navigator.vibrate&&navigator.vibrate(80);}catch(e){}}
function restart(){left=PER;fired=false;paused=false;last=Date.now();}
b.addEventListener('click',function(){unlock();if(left<=0){restart();}else{paused=!paused;last=Date.now();}draw();});
function draw(){var sec=Math.ceil(left/1000);n.textContent=left<=0?'0':String(sec);s.textContent=left<=0?'خلص':(paused?'موقف':'ثانية');b.style.borderColor=(left<=5000)?'var(--bad)':'var(--ok)';n.style.color=(left<=5000)?'var(--bad)':'var(--fg)';b.style.background=left<=0?'var(--badbg)':'var(--card)';}
setInterval(function(){var now=Date.now(),el=document.querySelector('#app .stem');if(!el){b.hidden=true;if(b.parentNode&&b.parentNode!==document.body)document.body.appendChild(b);stem='';last=now;return;}if(b.parentNode!==el.parentNode||b.nextSibling!==el)el.parentNode.insertBefore(b,el);b.hidden=false;var t=el.textContent.slice(0,300);if(t!==stem){stem=t;restart();}else if(!paused&&left>0){left-=now-last;if(left<=0){left=0;if(!fired){fired=true;beep();}}}last=now;draw();},200);
})();
</script>

const KEY="smle_solve_v1";
let P={};try{P=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const WKEY="smle_wallet_v2";let WAL=[];try{WAL=JSON.parse(localStorage.getItem(WKEY)||"[]")||[]}catch(e){}

const rsave=()=>{try{localStorage.setItem("smle_wallet_rm_v2",JSON.stringify(WREM))}catch(e){}};

const wsave=()=>{try{localStorage.setItem(WKEY,JSON.stringify(WAL))}catch(e){}};wsave();
function wdel(id){WAL=WAL.filter(x=>x!==id);if(!WREM.includes(id))WREM.push(id);wsave();rsave();render()}
function wundo(){WREM.forEach(id=>{if(!WAL.includes(id))WAL.push(id)});WREM=[];wsave();rsave();render()}
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BANKS=[],BYB={};
function init(){Q.forEach((q,i)=>{q.x=i;if(!BYB[q.b]){BYB[q.b]={n:q.b,sys:[],map:{}};BANKS.push(BYB[q.b])}
 const b=BYB[q.b];if(!b.map[q.s]){b.map[q.s]={n:q.s,g:[],m:{}};b.sys.push(b.map[q.s])}
 const s=b.map[q.s];if(!s.m[q.t]){s.m[q.t]={n:q.t,h:q.h,q:[]};s.g.push(s.m[q.t])}
 s.m[q.t].q.push(q)});
}
const stat=a=>{let d=0,w=0;a.forEach(q=>{const p=P[q.i];if(p){d++;if(!p.ok)w++}});return{n:a.length,d,w,r:d-w}};
const bar=s=>`<div class="bar"><i class="g" style="width:${100*s.r/s.n}%"></i><i class="r" style="width:${100*s.w/s.n}%"></i></div>`;
const AR={"Pediatrics":"أطفال","OB/GYN":"نساء وولادة","Surgery":"جراحة","Medicine":"باطنة","GameBoy":"GameBoy","Alhomrani Nov":"الحمراني نوفمبر","GameBoy Nov":"GameBoy نوفمبر (14 NOV)","Ninja":"Ninja اليوم (15 نوفمبر)","Alhomrani 10-14":"الحمراني 10-14 نوفمبر (الجديد)","Yasir Nov":"ياسر نوفمبر (إضافي)"};
let V={v:"home"};
function go(v){if(v.v!=='mist'&&v.v!=='wal'&&!v.rt)v.retry=undefined;if(v.rt&&!v.retry)v.retry={};V=v;render();window.scrollTo(0,0)}
function topb(title,back){return`<div class="top">${back?`<button class="btn" onclick="${back}">→</button>`:""}<h1>${title}</h1><button class="btn bad" onclick="go({v:'mist'})">غلطاتي (${Q.filter(q=>P[q.i]&&!P[q.i].ok).length})</button></div>`}
function home(){
 let h=topb("حل سلمى ⭐")+`<div class="tiles">`;
 BANKS.forEach(b=>{const all=[].concat(...b.sys.map(s=>[].concat(...s.g.map(g=>g.q))));const s=stat(all);
  h+=`<button class="tile" onclick="go({v:'bank',b:'${b.n}'})"><b>${AR[b.n]||b.n}</b><span class="sm">${s.n} سؤال · حليت ${s.d} · غلط ${s.w}</span>${bar(s)}</button>`});
 h+=`</div><div class="sm">تقدمك محفوظ على هذا الجهاز. اضغطي على الخيار وهو يسجل الغلط لحاله.</div>
 <div class="row"><button class="btn" onclick="backup()">نسخ احتياطي للتقدم</button></div><div id="bk"></div>
  <button class="grp" style="margin-top:18px;border-color:var(--acc)" onclick="go({v:'wal'})"><div class="t"><b>📦 الحافظة</b></div><div class="n">${WAL.length}</div></button>`;
 return h}
function bank(){const b=BYB[V.b];let h=topb(AR[b.n]||b.n,"go({v:'home'})");
 b.sys.forEach((s,si)=>{const one=s.g.length===1;
  if(!one){const ss=stat([].concat(...s.g.map(g=>g.q)));h+=`<div class="sys"><span>${esc(s.n)}</span><span class="sm">${ss.d}/${ss.n}</span></div>`}
  s.g.forEach((g,gi)=>{const st=stat(g.q);const nm=one?s.n:g.n;
   h+=`<button class="grp" onclick="go({v:'quiz',b:'${b.n}',s:${si},g:${gi},i:0,uns:false})"><div class="t ltr" dir="ltr"><b>${esc(nm)||"—"}</b>${bar(st)}</div><div class="n">${st.d}/${st.n}${st.w?` · <span style="color:var(--bad)">${st.w}✘</span>`:""}</div></button>`})});
 return h}
function hl(t,kws){if(!kws||!kws.length)return esc(t);

 return t.split(rx).map((x,i)=>i%2?`<mark class="kwh">${esc(x)}</mark>`:esc(x)).join("")}
function retryNow(id){V.retry=V.retry||{};delete V.retry[id];V.again=(V.again||[]).filter(x=>x.id!==id);V.show=id;render();window.scrollTo(0,0)}

  return`<button class="opt ${c}" ${p?"disabled":""} onclick="pick('${q.i}','${k}',${rt?1:0})"><b>${k}.</b><span class="ltr" dir="ltr">${esc(t)}</span></button>`}).join("");
 let r="";
 if(p){r=`<div class="reveal"><div class="res ${p.ok?"ok":"bad"}">${p.ok?"✔ صح":"✘ غلط — الجواب الصحيح "+q.a}</div>`+(p.ok?"":`<div style="background:none;padding:0"><button class="btn" onclick="retryNow(&#39;${q.i}&#39;)">🔁 أعيديه الحين</button> <span class="sm">وإلا يرجع لك بعد سؤالين</span></div>`)+

 return`<div class="card"><div class="tag">${esc(q.i)}${tot?` · ${idx+1}/${tot}`:""}</div><p class="stem ltr" dir="ltr">${hl(q.q,q.kw)}</p>${o}${r}${p&&(q.im||[]).length?`<div class="sm" style="margin-top:12px">📷 الشريحة الأصلية (فيها الصورة):</div>`+(q.im||[]).map(i=>`<img class="qimg" loading="lazy" src="img/${i}" alt="الصورة">`).join(""):""}</div>`}

 let h=topb(esc(b.sys[V.s].g.length===1?b.sys[V.s].n:g.n),"go({v:'bank',b:'"+V.b+"'})");
 if(g.h&&V.i===0)h+=`<div class="how ltr" dir="ltr"><b>${g.q.length} Qs · ${esc(g.n)}</b><br>${esc(g.h)}</div>`;
 h+=`<div class="row"><button class="btn" onclick="V.uns=!V.uns;V.rt=false;V.snap=null;V.i=0;render()">${V.uns?"✔ اللي ما حليته بس":"اللي ما حليته بس"}</button><button class="btn ${V.rt?'p':''}" onclick="go({v:'quiz',b:V.b,s:V.s,g:V.g,i:0,uns:false,rt:!V.rt})">${V.rt?"✔ وضع إعادة الحل":"أعيدي الحل"}</button></div>`;
 if(sq)h+=`<div class="how">🔁 رجع لك لأنك غلطتي فيه قبل شوي، حليه مرة ثانية</div>`;
 h+=qhtml(q,0,V.i,list.length,(V.rt||sq)?1:0);
 h+=`<div class="nav"><button class="btn" ${V.i?"":"disabled"} onclick="V.show=null;V.i--;render();window.scrollTo(0,0)">السابق</button><button class="btn p" onclick="nextQ(${list.length})">${(V.i<list.length-1||(V.again||[]).length||V.show)?"التالي":"خلصت المجموعة"}</button></div>`;
 return h}
function mist(){
 V.retry=V.retry||{};const m=Q.filter(q=>(P[q.i]&&!P[q.i].ok)||V.retry[q.i]);let h=topb("غلطاتي","go({v:'home'})");
 if(!m.length)return h+`<div class="card">ما عندك غلطات حاليًا 🎉</div>`;
 V.mb=V.mb||"all";
 h+=`<div class="how">غلطتي في ${m.length} سؤال. حليها صح وتختفي من القائمة.</div><div class="row">`+["all",...BANKS.map(b=>b.n)].map(n=>`<button class="btn ${V.mb===n?"p":""}" onclick="V.mb='${n}';render()">${n==="all"?"الكل":(AR[n]||n)}</button>`).join("")+`</div>`;
 const l=m.filter(q=>V.mb==="all"||q.b===V.mb);
 if(!l.length)return h+`<div class="card">لا شيء هنا.</div>`;
 V.mi=Math.min(V.mi||0,l.length-1);
 const sm=V.show?Q.find(x=>x.i===V.show):null,cm=sm||l[V.mi];h+=(sm?`<div class="how">🔁 رجع لك لأنك غلطتي فيه قبل شوي، حليه مرة ثانية</div>`:"")+`<div class="tag">${V.mi+1}/${l.length} · ${esc(cm.s)} › ${esc(cm.t)}</div>`+qhtml(cm,0,V.mi,l.length,1)+
 `<div class="nav"><button class="btn" ${V.mi?"":"disabled"} onclick="V.show=null;V.mi--;render()">السابق</button><button class="btn p" onclick="nextG(${l.length},'mi')">التالي</button></div>`;
 return h}
function wal(){
  V.retry=V.retry||{};const m=Q.filter(q=>WAL.includes(q.i));let h=topb("📦 الحافظة","go({v:'home'})");h+=`<div class="row"><button class="btn bad" onclick="WAL=[];WREM=[];wsave();rsave();render()">🗑 فرّغي الحافظة</button></div>`;if(WREM.length)h+=`<div class="row"><button class="btn" onclick="wundo()">↩ رجّعي اللي شلتيه (${WREM.length})</button></div>`;
  if(!m.length)return h+`<div class="card">فاضية 🎉</div>`;
  V.wb=V.wb||"all";
  h+=`<div class="row">`+["all",...BANKS.map(b=>b.n)].map(n=>`<button class="btn ${V.wb===n?"p":""}" onclick="V.wb='${n}';V.wi=0;render()">${n==="all"?"الكل":(AR[n]||n)}</button>`).join("")+`</div>`;
  const l=m.filter(q=>V.wb==="all"||q.b===V.wb);
  if(!l.length)return h+`<div class="card">لا شيء هنا.</div>`;
  V.wi=Math.min(V.wi||0,l.length-1);
  const sw=V.show?Q.find(x=>x.i===V.show):null,cw=sw||l[V.wi];h+=(sw?`<div class="how">🔁 رجع لك لأنك غلطتي فيه قبل شوي، حليه مرة ثانية</div>`:"")+`<div class="tag">${V.wi+1}/${l.length} · ${esc(cw.s)} › ${esc(cw.t)}</div>`+qhtml(cw,0,V.wi,l.length,1)+
  `<div class="row"><button class="btn bad" onclick="wdel('${cw.i}')">✓ راجعته</button></div>`+
  `<div class="nav"><button class="btn" ${V.wi?"":"disabled"} onclick="V.show=null;V.wi--;render();window.scrollTo(0,0)">السابق</button><button class="btn p" onclick="nextG(${l.length},'wi')">التالي</button></div>`;
  return h}
function nextQ(n){V.steps=(V.steps||0)+1;V.again=V.again||[];V.retry=V.retry||{};
 let d=V.again.find(x=>x.due<=V.steps);
 if(!d&&V.i>=n-1&&V.again.length)d=V.again[0];
 if(d){V.again=V.again.filter(x=>x!==d);delete V.retry[d.id];V.show=d.id}
 else{const was=V.show;V.show=null;if(V.i<n-1)V.i++;else{go({v:'bank',b:V.b});return}}
 render();window.scrollTo(0,0)}
function nextG(n,key){V.steps=(V.steps||0)+1;V.again=V.again||[];V.retry=V.retry||{};V[key]=V[key]||0;
 let d=V.again.find(x=>x.due<=V.steps);
 if(!d&&V[key]>=n-1&&V.again.length)d=V.again[0];
 if(d){V.again=V.again.filter(x=>x!==d);delete V.retry[d.id];V.show=d.id}
 else{V.show=null;if(V[key]<n-1)V[key]++}
 render();window.scrollTo(0,0)}
function pick(id,k,rt){const q=Q.find(x=>x.i===id);if(!q||(!rt&&P[id]))return;P[id]={c:k,ok:k===q.a?1:0,t:Date.now()};if(!P[id].ok&&(V.v==='quiz'||V.v==='wal'||V.v==='mist')){V.again=V.again||[];if(!V.again.some(x=>x.id===id))V.again.push({id:id,due:(V.steps||0)+2})}if(!P[id].ok&&!WAL.includes(id)){WAL.push(id);wsave();if(WREM.includes(id)){WREM=WREM.filter(x=>x!==id);rsave()}}if(rt){V.retry[id]=P[id]}save();V.keep=id;render();
 const o=document.querySelector(".reveal");if(o)o.scrollIntoView({block:"nearest",behavior:"smooth"})}
function resetG(){const g=BYB[V.b].sys[V.s].g[V.g];g.q.forEach(q=>delete P[q.i]);save();go({v:"quiz",b:V.b,s:V.s,g:V.g,i:0,uns:false})}
function backup(){$("#bk").innerHTML=`<textarea id="bt" readonly>${esc(JSON.stringify(P))}</textarea><div class="row"><button class="btn" onclick="navigator.clipboard.writeText($('#bt').value).catch(()=>$('#bt').select())">انسخي</button></div><div class="sm">للاسترجاع: الصقي النص هنا واضغطي استرجاع.</div><textarea id="rt"></textarea><div class="row"><button class="btn" onclick="try{P=JSON.parse($('#rt').value);save();go({v:'home'})}catch(e){alert}">استرجاع</button></div>`}
function render(){$("#app").className=V.v==="quiz"?"full":"";$("#app").innerHTML=V.v==="home"?home():V.v==="bank"?bank():V.v==="quiz"?quiz():V.v==="wal"?wal():mist()}
loadQ().then(d=>{Q=d;init();render()}).catch(e=>{$('#app').textContent='تعذر تحميل الأسئلة: '+e});
</script>

</body></html>
